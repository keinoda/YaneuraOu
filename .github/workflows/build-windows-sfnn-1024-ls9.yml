name: Build NAGISA_V4 Windows AVX2/AVX512

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-2022
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        cpu: [AVX2, AVX512]
    steps:
      - name: ビルドと検証のスクリプトを取得
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Releaseからソースを取得
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          @'
          import subprocess
          from pathlib import Path
          with Path("source.tar.gz").open("wb") as stream:
              subprocess.run(["gh", "api", "repos/keinoda/YaneuraOu/releases/assets/698943960",
                              "--header", "Accept: application/octet-stream"], stdout=stream, check=True)
          '@ | python
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: MSYS2のコンパイラを準備
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e
        with:
          msystem: MINGW64
          update: true
          install: >-
            base-devel
            xz
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-clang
            mingw-w64-x86_64-lld
            mingw-w64-x86_64-python

      - name: AVX512の検証用にIntel SDEを取得
        if: matrix.cpu == 'AVX512'
        shell: msys2 {0}
        run: |
          set -euo pipefail
          # Intel公式の配布ページに掲載されたSHA-256で照合する。
          curl -fsSL --retry 3 -o sde.tar.xz \
            https://github.com/petarpetrovt/setup-sde/releases/download/binaries/sde-external-10.13.1-2026-07-28-win.tar.xz
          echo "74e626ede09b0baa5011fc9e51b58627ea92c3fc0bae5fd7db34b490f335f651  sde.tar.xz" | sha256sum -c -
          mkdir sde
          tar -xJf sde.tar.xz -C sde --strip-components=1
          ls sde

      - name: ソースと元の評価データを照合
        shell: msys2 {0}
        run: python script/ngs_v4_release/windows_package.py prepare

      - name: 開発版の4指定とUSE_FINNY_RESETでtournament版をビルド
        shell: msys2 {0}
        run: |
          set -euo pipefail
          clang++ --version > validation/compiler.txt
          cd work/NAGISA_V4
          mingw32-make -C source -j"$(nproc)" tournament \
            OS=Windows_NT \
            YANEURAOU_EDITION=YANEURAOU_ENGINE_SFNN_halfkahm2_2304_15_64_progress8 \
            TARGET_CPU=${{ matrix.cpu }} COMPILER=clang++ PYTHON=python \
            ENGINE_NAME=NAGISA_V4 TARGET=../NAGISA_V4.exe \
            EXTRA_CPPFLAGS="-DHASH_KEY_BITS=128 -DTT_CLUSTER_SIZE=4 -DUSE_LAZY_EVALUATE -DUSE_FINNY_TABLES -DUSE_FINNY_RESET" \
            2>&1 | tee ../../validation/build.log

      - name: 配布ZIPを展開しWindowsで検証
        shell: msys2 {0}
        run: python script/ngs_v4_release/windows_package.py verify ${{ matrix.cpu }}

      - name: 検証済みWindows配布物を保存
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: NAGISA_V4-Windows-${{ matrix.cpu }}
          path: artifacts/NAGISA_V4-Windows-${{ matrix.cpu }}.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: 検証記録を配布物とは別に保存
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: NAGISA_V4-Windows-${{ matrix.cpu }}-validation
          path: validation/
          if-no-files-found: warn
          retention-days: 30
